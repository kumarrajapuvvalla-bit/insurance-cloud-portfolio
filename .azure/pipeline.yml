# ============================================================
# FILE: .azure/pipeline.yml
# PURPOSE: CI/CD pipeline - automatically build, test, and deploy
# ============================================================
# WHAT IS A CI/CD PIPELINE:
# CI = Continuous Integration: automatically test every code change
# CD = Continuous Deployment: automatically deploy passing code
#
# FLOW:
# You push code to GitHub →
# Azure DevOps detects the push →
# Runs tests (if tests fail, deployment stops) →
# Builds Docker image →
# Pushes image to GCP Container Registry →
# Deploys to Cloud Run →
# Runs smoke test to verify deployment worked
#
# ARCHITECTURE: This is the Azure DevOps component in the diagram
# connecting Azure (left side) to GCP (right side)
# ============================================================

# Pipeline name shown in Azure DevOps UI
name: Insurance CE Platform CI/CD

# -----------------------------------
# TRIGGER - When does the pipeline run?
# -----------------------------------
trigger:
  branches:
    include:
      - main           # Run on every push to main branch
      - develop        # Run on every push to develop branch
  paths:
    include:
      - api/**         # Only run if files in api/ changed
      - functions/**   # Or if functions/ changed
      - terraform/**   # Or if terraform/ changed

# Pull Request trigger - run checks on every PR before merging
pr:
  branches:
    include:
      - main
  paths:
    include:
      - api/**
      - functions/**

# -----------------------------------
# VARIABLES - Reusable values
# -----------------------------------
variables:
  # These are set as pipeline variables in Azure DevOps UI
  # NEVER put real values here - use Azure DevOps Library/Secret variables
  
  GCP_PROJECT_ID: $(GCP_PROJECT_ID)
  # $(GCP_PROJECT_ID) = reference to a pipeline variable
  # Set this in: Azure DevOps > Pipelines > Library > Variable Groups
  
  GCP_REGION: 'us-central1'
  ENVIRONMENT: 'dev'
  API_IMAGE_NAME: 'insurance-api'
  DOCKER_REGISTRY: 'gcr.io/$(GCP_PROJECT_ID)'

# -----------------------------------
# STAGES - Logical groups of jobs
# -----------------------------------
stages:

# ===========================================
# STAGE 1: BUILD AND TEST
# ===========================================
- stage: BuildAndTest
  displayName: 'Build and Test'
  jobs:
  
  - job: TestAPI
    displayName: 'Run API Tests'
    pool:
      vmImage: 'ubuntu-latest'
      # Ubuntu VM provided by Azure DevOps (free minutes included)
    
    steps:
    
    # Step 1: Download code from GitHub
    - checkout: self
      displayName: 'Checkout source code'
    
    # Step 2: Set up Python
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
      displayName: 'Set up Python 3.11'
    
    # Step 3: Install dependencies
    - script: |
        cd api
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
        # pytest = testing framework
        # httpx = HTTP client for testing FastAPI
      displayName: 'Install Python dependencies'
    
    # Step 4: Run linting (code style check)
    - script: |
        pip install flake8
        cd api
        flake8 main.py --max-line-length=120 --ignore=E501
        # flake8 checks code style - catches common mistakes
        # --max-line-length=120 allows lines up to 120 chars
      displayName: 'Run code linting'
      continueOnError: true
      # continueOnError = don't fail the pipeline for style issues
    
    # Step 5: Run security scan with SonarCloud
    # (mirrors SonarQube component in original architecture)
    - task: SonarCloudPrepare@1
      inputs:
        SonarCloud: 'SonarCloud'
        # 'SonarCloud' = service connection name in Azure DevOps
        organization: '$(SONAR_ORGANIZATION)'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'insurance-portfolio'
        cliProjectName: 'Insurance Portfolio'
      displayName: 'Prepare SonarCloud Analysis'
      continueOnError: true

  # -----------------------------------------
  # JOB 2: Build Docker Image
  # -----------------------------------------
  - job: BuildDocker
    displayName: 'Build Docker Image'
    dependsOn: TestAPI   # Only run if tests passed
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: self
    
    # Authenticate with GCP
    # The service account key is stored as a secret pipeline variable
    - task: GoogleCloudSdkInstaller@0
      displayName: 'Install Google Cloud SDK'
    
    - script: |
        # Authenticate using the service account key stored in Azure DevOps
        echo "$(GCP_SA_KEY)" | base64 -d > gcp-key.json
        # $(GCP_SA_KEY) = base64 encoded service account JSON key
        # Stored as a SECRET variable in Azure DevOps Library
        
        gcloud auth activate-service-account --key-file=gcp-key.json
        gcloud config set project $(GCP_PROJECT_ID)
        
        # Configure Docker to use GCP credentials
        gcloud auth configure-docker gcr.io
        
        # Clean up key file immediately after use
        rm gcp-key.json
      displayName: 'Authenticate with GCP'
    
    - script: |
        # Build the Docker image
        # -t = tag (name) the image
        # --build-arg = pass build arguments into the Dockerfile
        docker build \
          -t $(DOCKER_REGISTRY)/$(API_IMAGE_NAME):$(Build.BuildId) \
          -t $(DOCKER_REGISTRY)/$(API_IMAGE_NAME):latest \
          ./api
        # Build.BuildId = unique ID for this pipeline run (e.g., 20240315.1)
        # We tag with both the build ID and "latest"
        # This lets you reference a specific version or always get the newest
      displayName: 'Build Docker image'
    
    - script: |
        # Push both tags to Google Container Registry
        docker push $(DOCKER_REGISTRY)/$(API_IMAGE_NAME):$(Build.BuildId)
        docker push $(DOCKER_REGISTRY)/$(API_IMAGE_NAME):latest
      displayName: 'Push image to GCR'

# ===========================================
# STAGE 2: DEPLOY TO DEV
# ===========================================
- stage: DeployDev
  displayName: 'Deploy to Dev'
  dependsOn: BuildAndTest
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  # condition = only run this stage if:
  # - Previous stage succeeded AND
  # - We're on the develop branch (not main)
  
  jobs:
  - deployment: DeployAPI
    displayName: 'Deploy API to Cloud Run (dev)'
    environment: 'development'
    # environment = Azure DevOps environment (for approval gates and history)
    
    pool:
      vmImage: 'ubuntu-latest'
    
    strategy:
      runOnce:
        deploy:
          steps:
          
          - script: |
              echo "$(GCP_SA_KEY)" | base64 -d > gcp-key.json
              gcloud auth activate-service-account --key-file=gcp-key.json
              gcloud config set project $(GCP_PROJECT_ID)
              rm gcp-key.json
            displayName: 'Authenticate with GCP'
          
          - script: |
              # Deploy to Cloud Run using gcloud CLI
              gcloud run deploy insurance-dev-ce-data-api \
                --image=$(DOCKER_REGISTRY)/$(API_IMAGE_NAME):$(Build.BuildId) \
                --region=$(GCP_REGION) \
                --platform=managed \
                --service-account=insurance-api-sa@$(GCP_PROJECT_ID).iam.gserviceaccount.com \
                --no-traffic \
                --tag=build-$(Build.BuildId)
              # --no-traffic = deploy without sending traffic to new version yet
              # --tag = give this revision a named tag for testing
            displayName: 'Deploy new revision (no traffic)'
          
          - script: |
              # Run a smoke test against the new revision before sending traffic
              NEW_URL=$(gcloud run services describe insurance-dev-ce-data-api \
                --region=$(GCP_REGION) \
                --format='value(status.traffic[0].url)')
              
              # Test the health endpoint
              curl -f "${NEW_URL}/health" || exit 1
              echo "Health check passed - promoting to 100% traffic"
            displayName: 'Smoke test new revision'
          
          - script: |
              # If smoke test passed, send 100% traffic to new version
              gcloud run services update-traffic insurance-dev-ce-data-api \
                --region=$(GCP_REGION) \
                --to-latest
            displayName: 'Promote to production traffic'

# ===========================================
# STAGE 3: DEPLOY TO PRODUCTION
# ===========================================
- stage: DeployProd
  displayName: 'Deploy to Production'
  dependsOn: BuildAndTest
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  # Only deploy to prod from the main branch
  
  jobs:
  - deployment: DeployAPIProd
    displayName: 'Deploy API to Cloud Run (prod)'
    environment: 'production'
    # The production environment in Azure DevOps can require manual approval
    # Go to: Azure DevOps > Environments > production > Approvals and checks
    # Add yourself as required approver before prod deployments
    
    pool:
      vmImage: 'ubuntu-latest'
    
    strategy:
      runOnce:
        deploy:
          steps:
          
          - script: |
              echo "$(GCP_SA_KEY_PROD)" | base64 -d > gcp-key.json
              gcloud auth activate-service-account --key-file=gcp-key.json
              gcloud config set project $(GCP_PROJECT_ID)
              rm gcp-key.json
            displayName: 'Authenticate with GCP (prod)'
          
          - script: |
              # Canary deployment: send only 10% traffic to new version first
              gcloud run deploy insurance-prod-ce-data-api \
                --image=$(DOCKER_REGISTRY)/$(API_IMAGE_NAME):$(Build.BuildId) \
                --region=$(GCP_REGION) \
                --platform=managed \
                --no-traffic
              
              # Split traffic: 90% old, 10% new
              gcloud run services update-traffic insurance-prod-ce-data-api \
                --region=$(GCP_REGION) \
                --to-latest=10 \
                --to-revisions=LATEST=10
              
              echo "Canary deployed with 10% traffic. Monitor for 5 minutes..."
              sleep 300
            displayName: 'Canary deployment (10% traffic)'
          
          - script: |
              # If canary is healthy, promote to 100%
              gcloud run services update-traffic insurance-prod-ce-data-api \
                --region=$(GCP_REGION) \
                --to-latest
              echo "Production deployment complete - 100% traffic on new version"
            displayName: 'Promote canary to 100%'
